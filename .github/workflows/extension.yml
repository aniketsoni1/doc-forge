name: Extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vsix:
    name: Build · Verify · (guarded) Publish VSIX
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for Entra ID workload identity federation (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build + package + verify VSIX
        run: |
          npm run build:ext
          npm run package:vsix
          npm run verify:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: docforge-vsix
          path: artifacts/*.vsix

      # ────────────────────────────────────────────────────────────────
      # Authentication mode.
      #
      # Global Azure DevOps Personal Access Tokens are retired on
      # 1 December 2026, after which PAT-based publishing stops working:
      # https://devblogs.microsoft.com/devops/retirement-of-global-personal-access-tokens-in-azure-devops/
      #
      # Preferred:  Entra ID workload identity federation (no stored secret).
      #             Set AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID.
      # Fallback:   VSCE_PAT, until the retirement date.
      # ────────────────────────────────────────────────────────────────
      - name: Determine publish credentials
        id: auth
        if: startsWith(github.ref, 'refs/tags/')
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "mode=entra" >> "$GITHUB_OUTPUT"
            echo "Publishing with Entra ID workload identity federation."
          elif [ -n "$VSCE_PAT" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "::warning::Publishing with a Personal Access Token. Global Azure DevOps PATs retire on 2026-12-01 - migrate to Entra ID before then."
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No publish credentials configured - skipping Marketplace publish."
          fi

      - name: Azure login (workload identity federation)
        if: steps.auth.outputs.mode == 'entra'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to VS Code Marketplace (Entra ID)
        if: steps.auth.outputs.mode == 'entra'
        run: |
          VSIX="$(ls artifacts/*.vsix | head -1)"
          npx @vscode/vsce publish --azure-credential --no-dependencies --packagePath "$VSIX"

      - name: Publish to VS Code Marketplace (PAT - deprecated)
        if: steps.auth.outputs.mode == 'pat'
        run: |
          VSIX="$(ls artifacts/*.vsix | head -1)"
          npx @vscode/vsce publish --no-dependencies --packagePath "$VSIX"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX (guarded)
        if: ${{ startsWith(github.ref, 'refs/tags/') && secrets.OVSX_PAT != '' }}
        run: |
          VSIX="$(ls artifacts/*.vsix | head -1)"
          npx ovsx publish "$VSIX" -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
