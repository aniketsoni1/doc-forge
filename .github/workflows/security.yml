name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Runtime dependencies are the ones that ship inside the VSIX, so an
      # advisory there is a real user-facing risk: fail the build.
      - name: Audit runtime dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      # Dev-tool advisories matter, but a new one landing upstream should not
      # block an unrelated PR. Reported, not enforced - and Dependabot is no
      # longer told to ignore tooling majors, so these get fixed rather than
      # accumulating silently.
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=high || true

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # Requires the repository's Dependency graph feature:
      #   Settings -> Advanced Security -> Dependency graph
      #
      # It is off for this repository today, and the action responds by failing
      # the job outright ("Dependency review is not supported on this
      # repository"), which blocks every pull request for a reason no
      # contributor can fix from the code.
      #
      # So this step is advisory until the feature is switched on. That is not a
      # coverage gap: the audit job above blocks on runtime advisories, which is
      # the class that actually ships inside the VSIX. Once Dependency graph is
      # enabled, delete `continue-on-error` to make this blocking too.
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
