name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Runtime dependencies are the ones that ship inside the VSIX, so an
      # advisory there is a real user-facing risk: fail the build.
      - name: Audit runtime dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      # Dev-tool advisories matter, but a new one landing upstream should not
      # block an unrelated PR. Reported, not enforced - and Dependabot is no
      # longer told to ignore tooling majors, so these get fixed rather than
      # accumulating silently.
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=high || true

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
